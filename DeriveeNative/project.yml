name: Derivee
options:
  bundleIdPrefix: com.derivee
  minimumXcodeGenVersion: 2.0.0
targets:
  Derivee:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: Derivee
      - path: ../observer/transit_delta.sqlite
        type: file
        optional: true
    info:
      path: Derivee/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "We need your location to track explored hexes."
        NSLocationAlwaysAndWhenInUseUsageDescription: "We need your location in the background to track explored hexes."
        UIBackgroundModes:
          - location
        NSSupportsLiveActivities: YES
        UIFileSharingEnabled: YES
        LSSupportsOpeningDocumentsInPlace: YES
    dependencies:
      - package: swift-h3
        product: H3
      - package: GRDB.swift
        product: GRDB
      - package: maplibre-gl-native-distribution
        product: MapLibre
      - package: swift-zstd
        product: SwiftZSTD
      - package: swift-protobuf
        product: SwiftProtobuf
      - target: DeriveeWidget
  DeriveeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: DeriveeTests
    dependencies:
      - target: Derivee
      - package: swift-snapshot-testing
        product: SnapshotTesting
      - package: swift-protobuf
        product: SwiftProtobuf
  DeriveeWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.derivee.Derivee.DeriveeWidget
      GENERATE_INFOPLIST_FILE: NO
    info:
      path: DeriveeWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: DeriveeWidget
      - path: Derivee/TrackingAttributes.swift
      - path: Derivee/MilestoneModels.swift
      - path: Derivee/CrystallineAperture.swift

packages:
  swift-h3:
    url: https://github.com/JeremyEspresso/swift-h3
    branch: main
  GRDB.swift:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.27.0
  maplibre-gl-native-distribution:
    url: https://github.com/maplibre/maplibre-gl-native-distribution.git
    from: 6.20.1
  swift-zstd:
    url: https://github.com/aperedera/SwiftZSTD.git
    from: 1.0.0
  swift-snapshot-testing:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    from: 1.15.4
  swift-protobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: 1.28.0

schemes:
  Derivee:
    build:
      targets:
        Derivee: all
        DeriveeWidget: all
        DeriveeTests: [test]
    run:
      config: Debug
      location:
        reference: NYC_Walk.gpx
    test:
      config: Debug
      targets:
        - DeriveeTests
