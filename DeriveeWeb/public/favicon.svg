<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d13"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Concentric radar / fog rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#162032" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#162032" stroke-width="1.5"/>

  <!-- Radar crosshairs -->
  <line x1="36" y1="256" x2="476" y2="256" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="256" y1="36" x2="256" y2="476" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- North indicator mark -->
  <line x1="256" y1="46" x2="256" y2="34" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- "D" Transit Loop Spine & Arc -->
  <!-- Outer Glow Arc -->
  <path d="M 235 131 L 271 131 A 125 125 0 0 1 271 381 L 235 381 Z"
        fill="none" stroke="#0284c7" stroke-width="14" opacity="0.3" filter="url(#glow)"/>
  <!-- Sharp D Track -->
  <path d="M 235 131 L 271 131 A 125 125 0 0 1 271 381 L 235 381 Z"
        fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Compass Needle: North (Pointed Up) -->
  <polygon points="256,156 256,256 234,256" fill="#06b6d4"/>
  <polygon points="256,156 278,256 256,256" fill="#e0f2fe"/>

  <!-- Compass Needle: South (Pointed Down) -->
  <polygon points="256,256 256,321 234,256" fill="#1e293b"/>
  <polygon points="256,256 278,256 256,321" fill="#475569"/>

  <!-- Center Station Node (Amber Transit Bullet) -->
  <circle cx="256" cy="256" r="14" fill="#f59e0b" stroke="#0f172a" stroke-width="3"/>
  <circle cx="256" cy="256" r="5" fill="#ffffff"/>
</svg>
